<!DOCTYPE html>
<html>
<head>
    <title>Lab 06 - JSON</title>
</head>
<body>

<script>

const bookData = {
    "Books": [
        {
            "title": "The Great Gatsby",
            "author": "F. Scott Fitzgerald",
            "publicationYear": 1925,
            "genres": ["Fiction", "Classics"]
        },
        {
            "title": "To Kill a Mockingbird",
            "author": "Harper Lee",
            "publicationYear": 1960,
            "genres": ["Fiction", "Coming-of-Age"]
        }
    ]
};
// (a) Title of the first book
console.log("Title of the first book:");
console.log(bookData.Books[0].title);

// (b) Author of the second book
console.log("Author of the second book:");
console.log(bookData.Books[1].author);

// (c) Genres of all books
console.log("Genres of all books:");

bookData.Books.forEach(function(book) {
    console.log(book.genres);
});
</script>

</body>
</html>
